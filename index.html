
<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f2f2f2;
        }
        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }
        nav {
            background-color: #444;
            padding: 15px;
            text-align: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }
        section {
            padding: 40px;
            text-align: center;
        }
        .home {
            background-color: lightblue;
            padding: 80px 20px;
        }
        button {
            background-color: #333;
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Website</h1>
        <p>Welcome to my website</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </nav>

    <section class="home" id="home">
        <h2>Welcome!</h2>
        <p>This is my first website using HTML and CSS.</p>
        <button onclick="alert('Welcome to my website!')">Click Me</button>
    </section>

    <section id="about">
        <h2>About Us</h2>
        <p>This website is created using HTML and CSS.</p>
    </section>

    <section id="services">
        <h2>Our Services</h2>
        <p>Web Design | Web Development | Programming</p>
    </section>

    <section id="contact">
        <h2>Contact Us</h2>
        <p>Email: example@gmail.com</p>
    </section>

    <footer>
        <p>Copyright 2026 My Website</p>
    </footer>

</body>
</html>
